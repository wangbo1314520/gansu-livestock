# -*- coding: utf-8 -*-
# 一键编排（部署预演，未实际启动）
# 用法：docker compose up -d
# 注意：首次启动需先导入 sql/init.sql + init_data.sql（见 docs/部署指南.md）

services:
  mysql:
    image: mysql:8.0
    container_name: gl_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}       # 从环境变量读取，勿写入文件
      MYSQL_DATABASE: gansu_livestock
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql              # 数据落宿主机 data/ 目录
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/1_init.sql:ro
      - ./backend/sql/init_data.sql:/docker-entrypoint-initdb.d/2_init_data.sql:ro
    ports:
      - "3307:3306"                              # 宿主机 3307 避免与本机 MySQL 冲突
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 8

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: gl_backend
    restart: unless-stopped
    environment:
      DB_PASSWORD: ${DB_PASSWORD}
      DB_HOST: mysql
      APP_MODE: ${APP_MODE:-school}
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "5000:5000"

  nginx:
    image: nginx:1.27-alpine
    container_name: gl_nginx
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/html:/usr/share/nginx/html:ro   # 两前端 dist 复制到此（见部署指南）
    ports:
      - "80:80"
