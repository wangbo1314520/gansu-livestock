# 甘肃牛羊价格平台 Nginx 配置（部署预演）
# 学校版 / ，家用版 /home/，API 反代 /api -> backend:5000

server {
    listen 80;
    server_name _;

    # 学校版（frontend-school/dist）
    location / {
        root /usr/share/nginx/html/school;
        try_files $uri $uri/ /index.html;
    }

    # 家用版（frontend-home/dist）
    location /home/ {
        alias /usr/share/nginx/html/home/;
        try_files $uri $uri/ /home/index.html;
    }

    # API 反代
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;    # 预测接口较慢
    }
}
